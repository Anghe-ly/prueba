<div class="container mt-4">
  <div class="row align-items-start">

    <!-- Columna izquierda-->
    <div class="col-md-4 text-center">

    
      <div class="imagenProducto">
       <img [src]="producto.img" alt="" class="img-fluid">
      </div>


    </div>

    <!-- Columna derecha -->
    <div class="col-md-8">

<div class="containerNombre">
        <h2 class="mt-3 mt-md-0">{{producto.nombre}}</h2>
</div>
      <h4 class="mt-1 fw-bold">{{producto.precio | currency:'EUR'}}</h4>

      <p class="mt-3">

        Todos nuestros productos se componen de fórmulas probadas dermatológicamente y son cruelty free y veganas. 
        Elaborados con ingredientes 100% naturales.
      </p>

      <button class="btn btnAgregarCarrito mt-3 w-75" id="botonAgregarCarrito" (click)="agregarCarrito(producto)">Añadir al carrito</button>

    </div>

  </div>
</div>



<!-- Toast para compra producto -->

<div class="toast-container position-fixed top-2 end-0 p-3">
  <div id="toastProducto"  class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    
    <div class="toast-body">
      El producto se ha añadido a tu carrito.
      <button type="button" class="btn-close ms-2" data-bs-dismiss="toast"></button>
    </div>

  </div>


</div>
