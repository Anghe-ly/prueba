<div class="logo-header d-flex justify-content-center align-items-center py-3">
  <img src="/img/logo.png" alt="logo" class="logo-img img-fluid">
</div>

<nav class="navbar busqueda navbar-expand-lg px-3">

  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
          data-bs-target="#menuPrincipal">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- CONTENIDO DEL MENÚ -->
  <div class="collapse navbar-collapse" id="menuPrincipal">

    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item"><a class="nav-link" (click)="redirigirHome()">
        Home
      </a>
    </li>
      <li class="nav-item"><a class="nav-link" (click)="redirigirLista()">
        Catálogo
      </a>
      </li>
      <li class="nav-item"><a class="nav-link" (click)="redirigirCarrito()" *ngIf="authService.logueado$ | async">
        Carrito
      </a>
    </li>
    </ul>

    <!-- BARRA DE BÚSQUEDA -->

  <div class="search-pill">
    <input type="text" placeholder="Buscar productos...">
    <button>
      <i class="bi bi-search"></i>
    </button>
  </div>


    <!-- BOTONES DE SESIÓN -->
    <div class="ms-3">

      @if(authService.isAdmin()){
        <button class="btn btnLogin me-2">
        <a class="nav-link p-0" routerLink="/admin">
          Zona Admin
        </a>
      </button>
      }
    
        @if(authService.isAdmin()){
        <button class="btn btnLogin me-2">
        <a class="nav-link p-0" routerLink="/admin">
          Zona Admin
        </a>
      </button>
      }
      
      @if(!(authService.logueado$ | async)){
          <button class="btn btnLogin me-2">
        <a class="nav-link p-0" routerLink="/inicio-sesion">
          Iniciar Sesión
        </a>
      </button>
      }@else {
            <button class="btn btnLogin me-2" 
              (click)="cerrarSesion()">

        Cerrar Sesión
      
      </button>
      }

  
    </div>
  </div>
</nav>
