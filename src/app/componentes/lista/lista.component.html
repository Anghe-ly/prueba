

<div class="contenedor">
    <div class="grid">
        
    @for (productos of listaProducto; track $index){
        <div class="contenedorProducto">
                <div (click)="redirigirDetalles(productos.idProducto)">
        <img
        [src]="productos.img"
        alt="imagen del producto">
        <h5>{{ productos.nombre }}</h5>
        <p>{{ productos.precio | currency:'EUR'}} </p>

                </div>
    
        <button type="button"
         class="btn btnCompra btn-outline-primary"
          (click)="agregarCarrito(productos)">
          AÑADIR AL CARRITO
        </button>

        </div>

    }
    </div>
</div>
