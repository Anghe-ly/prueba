

<div class="contenedor">
    <div class="grid">
        
    @for (productos of listaProducto; track $index){
        <div class="contenedorProducto">

                <button class="btn" type="button" data-bs-toggle="dropdown" id="botonMenu">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z"/></svg>
                </button>
                <div class="dropdown-menu">
                    <button class="dropdown-item" type="button" (click)="eliminarProducto(productos.idproducto)" >Eliminar</button>
                    <button class="dropdown-item" type="button" (click)="redirigirEditar(productos.idproducto)" >Editar</button>

                </div>
        <img src="/img/sylusChibi.png" alt="sylus">
         {{ productos.nombre }}
       
        <button type="button" class="btn btn-outline-primary">AÑADIR AL CARRITO</button>

        </div>

    }
    </div>
</div>
