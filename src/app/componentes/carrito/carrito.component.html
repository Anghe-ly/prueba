<!-- Carrito con modal -->

<div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="carritoModalLabel">Carrito</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">    
        
    <div class="offcanvas-body">
    <div *ngIf="carrito.productos.length=== 0" class="text-center text-muted">
      <p>El carrito está vacío.</p>
    </div>
    <div *ngFor="let producto of carrito.productos; let i = index" class="card mb-3">
      <div class="card-body d-flex align-items-center">
        <div class="flex-grow-1">
          <h6 class="card-title mb-1">{{ producto.nombre }}</h6>
          <p class="card-text mb-1">Precio: {{ producto.precioUnidad | currency:'EUR' }}</p>
          <div class="input-group input-group-sm w-75">
            <button class="btn btn-outline-secondary" type="button">-</button>
            <input type="text" class="form-control text-center" [value]="producto.cantidad" readonly>
            <button class="btn btn-outline-secondary" type="button">+</button>
          </div>
        </div>
        <button class="btn btn-danger btn-sm ms-2">
          <i class="bi bi-trash"></i> <!-- Bootstrap Icons -->
        </button>
      </div>
    </div>
    <div *ngIf="carrito.productos.length > 0" class="mt-4">
      <button class="btn btn-success w-100" (click)="onSubmit()" >Finalizar compra</button>
    </div>
  </div>
</div>
