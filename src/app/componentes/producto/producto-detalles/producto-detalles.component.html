<div class="container mt-4">
  <div class="row align-items-start">

    <!-- Columna izquierda-->
    <div class="col-md-4 text-center">

      <div id="carruselProducto" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">
          @for (img of imagenesProducto; track $index) {
            <div class="carousel-item" [class.active]= "$index === 0">
              <img [src]="img" class="d-block w-100" alt="Imagen del producto">
            </div>
          }
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#carruselProducto" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#carruselProducto" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>

      </div>

    </div>

    <!-- Columna derecha -->
    <div class="col-md-8">

      <h2 class="mt-3 mt-md-0">{{producto.nombre}}</h2>

      <h4 class="text-primary fw-bold">{{producto.precio}}</h4>

      <p class="mt-3">
        Este es un texto descriptivo del producto...
      </p>

      <button class="btn btn-primary mt-3" id="botonAgregarCarrito" (click)="agregarCarrito(producto)">Añadir al carrito</button>

    </div>

  </div>
</div>



<!-- Toast para compra producto -->

<div class="toast-container position-fixed top-2 end-0 p-3">
  <div id="toastProducto"  class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    
    <div class="toast-body">
      El producto se ha añadido a tu carrito.
      <button type="button" class="btn-close ms-2" data-bs-dismiss="toast"></button>
    </div>

  </div>


</div>
